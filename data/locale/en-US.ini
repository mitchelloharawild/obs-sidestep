Group.Detection="Detection"
Strategy="Place camera on"
Strategy.Any="Empty space (avoid all content)"
Strategy.Any.Description="Every edge or moving pixel counts as content: text, lines, shapes' outlines, photos and video. Safest when unsure."
Strategy.BgImage="Background photos (sit over slide images)"
Strategy.BgImage.Description="For slides with a photo filling one side (e.g. image-left / image-right layouts): the camera may sit on the photo and moves onto it when a slide with an image appears; on the plain background it avoids content as with \"Any content\". Flat shapes and panels count as content; small or moving pictures are not sat on."
Strategy.Solid="Plain background (avoid shapes and panels too)"
Strategy.Solid.Description="Only sits on the slide's plain background colour: text, pictures and also the inside of filled shapes, coloured panels and code blocks count as content. Best for typical slide decks; on gradient or photo backgrounds it avoids anything that stands out locally."
Strategy.Activity="Quiet areas (avoid recent changes, for screen shares)"
Strategy.Activity.Description="For screen shares and live demos: the camera avoids where things recently changed (typing, output, cursor, playing video) and keeps away from it for several seconds after it stops (half-life ~8 s). Static windows and text may be covered, though empty space is still preferred; raise Sensitivity to avoid static text too. Whole-screen changes (window switches, scrolling) are not counted as activity. Needs \"Treat motion as content\"; pairs well with a short check interval."
Interval="Check every"
Sensitivity="Sensitivity"
Sensitivity.Description="Higher values need a more completely empty area. 50 tolerates about 1% of the area containing content."
UseMotion="Treat motion as content"
IgnoreTemplate="Ignore template elements"
IgnoreTemplate.Description="Content that stays identical across several slide changes (logos, footers, window chrome) may be covered. Slide numbers change, so they still count as content."
DebugOverlay="Show debug overlay (visible in output — for setup only)"
DebugOverlay.Description="Draws detected content (red), detected background images (blue), candidate positions and their scores onto this source. It appears in preview AND program/recordings, so turn it off when done."

